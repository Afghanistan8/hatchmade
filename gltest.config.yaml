# Hatchmade test configuration (gltest / genlayer-test).
# Direct Mode tests run against the in-process VM and do not need a node,
# but the suite shares this file with any Studio/localnet runs.
networks:
  default: localnet

  localnet:
    url: "http://127.0.0.1:4000/api"
    leader_only: false

  studionet:
    url: "https://studio.genlayer.com/api"
    leader_only: false

paths:
  contracts: "contracts"
  artifacts: "artifacts"

environment: .env
